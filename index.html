<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>AgriLens Live</title><link rel="stylesheet" href="style.css"></head><body>
      <div class="mobile-frame">
        <div class="status-bar"><span>9:41</span><span>🔋</span></div>
        <div class="camera-bg">
          <div class="viewfinder"><div class="laser" id="laser"></div></div>
          <p class="inst">Center leaf in frame</p>
        </div>
        <div class="controls"><button id="capture-btn"><div class="inner"></div></button></div>
        <div class="bottom-sheet" id="result-sheet">
          <div class="sheet-handle"></div>
          <h2>Tomato Early Blight</h2>
          <span class="badge">94% Confidence</span>
          <p class="treatment">Treatment: Prune infected leaves and apply copper fungicide immediately.</p>
          <button id="reset-btn">Scan Another</button>
        </div>
      </div>
      <script src="app.js"></script></body></html>
